<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <title>Document</title>
</head>
<body>
    <main>
        <div class="search-area">
        <label for="search-input"></label>
        <input type="text" id="search-input" placeholder="Enter a city..." required>
        </div>
        
        <!--Main Weather Section starts-->
        <div class="main-weather">
            <div class="main-weather-text">
                <h1 class="main-weather-city">JOHANNESBURG</h1>
                <p class="main-weather-description">rainy</p>
                <h1 class="main-weather-temp">25°C</h1>
            </div>
            <div class="main-weather-img">
                <i class="bi bi-cloud-sun" aria-hidden="false"></i>
            </div>
        </div>
        <!--Main Weather Section ends-->
        <div class="hourly-forcast-section">
            <div class="hourly-forecast-card"></div>
        </div>
        <div class="condition-section">
            <H3 class="air-conditions">Air Conditions</H3>
            <div class="condition">
                <p>Real Feel</p>
                <h1 class="condition-h1"></h1>
            </div>
            <div class="condition">
                <p>Chance of Rain</p>
                <h1 class="condition-h1"></h1>
            </div>
            <div class="condition">
                <p>Humidity</p>
                <h1 class="condition-h1"></h1>
            </div>
            <div class="condition">
                <p>Wind Speed</p>
                <h1 class="condition-h1"></h1>
            </div>
        </div>
        <aside class="forecast-section">
            <div class="forecast-card">
                <p class="forecast-day"></p>
                
                <h3 class="forecast-description"></h3>
            </div>
        </aside>
    </main>
</body>
</html>
