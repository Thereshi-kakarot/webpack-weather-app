<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <div class="search-area">
        <label for="search-input">Search:</label>
        <input type="text" id="search-input" placeholder="Enter a city..." required>
        </div>
        
        <div class="hourly-forcast-section">
            <div class="hourly-forecast-card"></div>
        </div>
        <div class="condition-section">
            <H3 class="air-conditions">Air Conditions</H3>
            <div class="condition">
                <p>Real Feel</p>
                <h1 class="condition-h1"></h1>
            </div>
            <div class="condition">
                <p>Chance of Rain</p>
                <h1 class="condition-h1"></h1>
            </div>
            <div class="condition">
                <p>Humidity</p>
                <h1 class="condition-h1"></h1>
            </div>
            <div class="condition">
                <p>Wind Speed</p>
                <h1 class="condition-h1"></h1>
            </div>
        </div>
        <aside class="forecast-section">
            <div class="forecast-card">
                <p class="forecast-day"></p>
                
                <h3 class="forecast-description"></h3>
            </div>
        </aside>
    </main>
</body>
</html>
